project:
  type: website
  output-dir: _book
  render:
    - "**/*.qmd"
    - "!policies/policies.qmd"
  resources:
    - "slides/"
    # Only referenced from JS at runtime, so Quarto can't discover it
    # by scanning the sources, it has to be copied explicitly.
    - "figures/calvin-logo-dark.png"

website:
  title: "CS 112 | Fall 2026"
  description: "Introduction to Data Structures, C++, data structures, and algorithm analysis. Calvin University, Fall 2026."
  site-url: https://ericaraujophd.github.io/26fa-cs112/
  favicon: figures/calvin-logo.png
  image: figures/calvin-logo.png       # preview card when a link is shared
  open-graph: true
  repo-url: https://github.com/ericaraujophd/26fa-cs112/
  repo-actions: [issue]
  search: true

  # Only these appear in the sidebar. Every .qmd still renders
  # (see project.render above), assignment pages are reachable
  # from the Assignments hub and from the Schedule.
  sidebar:
    logo: figures/calvin-logo.png            # swapped to -dark.png in dark mode
    logo-alt: Calvin University
    pinned: true
    style: floating
    search: true
    contents:
      - text: "Home"
        href: index.qmd
      - content/schedule.qmd
      - content/checkins.qmd
      - content/assignments/index.qmd
      - section: "Course Information"
        contents:
          - syllabus.qmd
          - policies/grading.qmd
          - policies/honesty.qmd
          - policies/classroom.qmd

lang: en

language:
  title-block-published: "Last Updated"

format:
  html:
    # include-before-body: _banner.html
    include-in-header: _display-head.html   # apply saved text size before paint
    include-after-body:
      - _display.html       # theme + text size panel
      - _release.html       # hide assignments until their week opens
    number-sections: false
    toc: false
    theme:
      light: united
      dark: darkly
    css: custom.css
    highlight-style: github
    code-copy: true
    code-overflow: wrap
