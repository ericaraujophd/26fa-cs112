# Changes to the class schedule, made after the plan was written.
#
# course/planning/course-map.yml stays the IDEAL plan and is never edited to
# match what actually happened (Eric, Sep 15). What actually changes, a class
# canceled or moved, goes here, and cs112-game/scripts/course_sync.py applies it
# to the new site's schedule (content/course/term.json):
#
#   date    the class day the change is about (YYYY-MM-DD)
#   title   what that day now says on the schedule. A date the plan has no
#           lecture for (weeks 12 to 14 list none) is added to its week.
#   day     Mon, Tue, Wed... (only needed for a date the plan does not list)
#
# The old site's schedule (content/schedule.qmd) is written by hand: it carries
# the same changes as notes in each week.

lectures:
  # Eric at AAR 2026, Nov 20 to 24, then Thanksgiving (Nov 17).
  - date: 2026-11-20
    title: "No class (Prof. Araújo at AAR 2026). The STL set and map moves to Mon Nov 30"
  - date: 2026-11-23
    day: Mon
    title: "No class (Prof. Araújo at AAR 2026), and no labs Tue Nov 24"
  # The two lost classes, taught when we are back, and parallelism cut to
  # three classes (Eric, Nov 17: "two or three is more than enough").
  - date: 2026-11-30
    day: Mon
    title: "The STL set and map (moved from Nov 20)"
  - date: 2026-12-02
    day: Wed
    title: "AVL trees (moved from Nov 23)"
  - date: 2026-12-04
    day: Fri
    title: "Parallelism 1: Moore's law and fork-join"
  - date: 2026-12-07
    day: Mon
    title: "Parallelism 2: OpenMP"
  - date: 2026-12-09
    day: Wed
    title: "Parallelism 3: experiments, and course recap"
