  <rect class="cell" x="186" y="406" width="38" height="38"/>
  <text class="val" x="205.0" y="431.0" text-anchor="middle">.</text>
  <rect class="cellwall" x="224" y="406" width="38" height="38"/>
  <text class="val" x="243.0" y="431.0" text-anchor="middle">#</text>
  <rect class="cell" x="262" y="406" width="38" height="38"/>
