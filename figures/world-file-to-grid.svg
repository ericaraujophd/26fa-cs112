  <rect class="cell" x="382" y="108" width="34" height="34"/>
  <text class="val" x="399.0" y="131.0" text-anchor="middle">.</text>
  <rect class="cell" x="416" y="108" width="34" height="34"/>
  <text class="val" x="433.0" y="131.0" text-anchor="middle">.</text>
  <rect class="cellwall" x="450" y="108" width="34" height="34"/>
  <text class="val" x="467.0" y="131.0" text-anchor="middle">#</text>
  <rect class="cell" x="484" y="108" width="34" height="34"/>
  <text class="val" x="501.0" y="131.0" text-anchor="middle">.</text>
  <rect class="cell" x="518" y="108" width="34" height="34"/>
  <text class="val" x="535.0" y="131.0" text-anchor="middle">.</text>
  <rect class="cell" x="552" y="108" width="34" height="34"/>
  <text class="val" x="569.0" y="131.0" text-anchor="middle">.</text>
  <rect class="cell" x="382" y="142" width="34" height="34"/>
