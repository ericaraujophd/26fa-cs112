  <rect class="cell" x="338" y="400" width="38" height="38"/>
  <text class="val" x="357.0" y="425.0" text-anchor="middle">.</text>
  <rect class="cell" x="148" y="438" width="38" height="38"/>
  <text class="val" x="167.0" y="463.0" text-anchor="middle">.</text>
  <rect class="cell" x="186" y="438" width="38" height="38"/>
  <text class="val" x="205.0" y="463.0" text-anchor="middle">.</text>
  <rect class="cellwall" x="224" y="438" width="38" height="38"/>
  <text class="val" x="243.0" y="463.0" text-anchor="middle">#</text>
  <rect class="cell" x="262" y="438" width="38" height="38"/>
  <text class="val" x="281.0" y="463.0" text-anchor="middle">.</text>
  <rect class="cell" x="300" y="438" width="38" height="38"/>
  <text class="val" x="319.0" y="463.0" text-anchor="middle">.</text>
  <rect class="cell" x="338" y="438" width="38" height="38"/>
