  <text class="idx" x="138" y="468.0" text-anchor="end">2</text>
  <text class="idx" x="138" y="506.0" text-anchor="end">3</text>
  <rect class="cell" x="148" y="368" width="38" height="38"/>
  <text class="val" x="167.0" y="393.0" text-anchor="middle">.</text>
  <rect class="cell" x="186" y="368" width="38" height="38"/>
