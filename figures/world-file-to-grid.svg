  <rect class="cell" x="524" y="222" width="19" height="19"/>
  <text class="code" x="533.5" y="236" text-anchor="middle">o</text>
  <text class="anno" x="549" y="236">SAND</text>
  <rect class="cell" x="595" y="222" width="19" height="19"/>
