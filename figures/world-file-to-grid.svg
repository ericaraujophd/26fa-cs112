  <text class="code" x="394.5" y="488" text-anchor="middle">o</text>
  <text class="anno" x="412" y="488">SAND</text>
  <rect class="cell" x="384" y="509" width="21" height="21"/>
  <text class="code" x="394.5" y="524" text-anchor="middle">~</text>
  <text class="anno" x="412" y="524">WATER</text>
  <rect class="tag" x="16" y="602" width="150" height="26" rx="4"/>
  <text class="tagtext" x="26" y="620">the two rings</text>
  <text class="note" x="16" y="652">are the emitters, and they are not cells. Each drops one</text>
  <text class="note" x="16" y="673">grain there per step, sand at grid[0][2] and water at</text>
  <text class="note" x="16" y="694">grid[2][5]. Both cells load EMPTY.</text>
  <text class="stage" x="16" y="748">What loadWorld fills in</text>
  <rect class="card" x="16" y="760" width="488" height="330" rx="5"/>
  <text class="code" xml:space="preserve" x="34" y="790">rows       = 4        cols       = 6</text>
  <text class="code" xml:space="preserve" x="34" y="816">emitCount  = 2        grid[1][2] = WALL</text>
  <text class="anno" x="34" y="852">three arrays, one column per emitter:</text>
  <text class="idx" x="250.0" y="882" text-anchor="middle">[0]</text>
  <text class="idx" x="342.0" y="882" text-anchor="middle">[1]</text>
  <text class="code" x="46" y="910">emitRow</text>
  <text class="code" x="250.0" y="910" text-anchor="middle">0</text>
  <text class="code" x="342.0" y="910" text-anchor="middle">2</text>
  <text class="code" x="46" y="938">emitCol</text>
  <text class="code" x="250.0" y="938" text-anchor="middle">2</text>
  <text class="code" x="342.0" y="938" text-anchor="middle">5</text>
  <text class="code" x="46" y="966">emitElem</text>
  <text class="code" x="250.0" y="966" text-anchor="middle">SAND</text>
  <text class="code" x="342.0" y="966" text-anchor="middle">WATER</text>
  <rect class="ring" x="210" y="892" width="80" height="88" rx="4"/>
  <rect class="ring" x="302" y="892" width="80" height="88" rx="4"/>
  <text class="note" x="34" y="1012">An emitter is a column, not an array. Its row, its column</text>
  <text class="note" x="34" y="1032">and its element are held together by nothing except the</text>
  <text class="note" x="34" y="1052">index they share. emitCount says how many columns are in</text>
  <text class="note" x="34" y="1072">use; the rest of each array is untouched.</text>
  <text class="stage" x="16" y="1108">Capacity is not size</text>
  <rect class="card" x="16" y="1120" width="488" height="360" rx="5"/>
  <text class="anno" x="34" y="1142">char grid[64][128], the same for every world: 8192 cells, to scale</text>
  <rect class="reserved" x="68.0" y="1154" width="384" height="192"/>
  <rect class="inplay" x="68.0" y="1154" width="18" height="12"/>
  <rect class="ring" x="65.0" y="1151" width="24" height="18" rx="2"/>
  <path class="flow" d="M92.0 1160.0 H138.0"/>
  <text class="note" x="144.0" y="1165.0">this world: 4 x 6 = 24 cells</text>
  <text class="note" x="34" y="1372">The other 8168 hold whatever was in that memory before.</text>
  <text class="note" x="34" y="1392">Nobody cleared them. Reading one is reading rubbish,</text>
  <text class="note" x="34" y="1412">which is why every loop you write stops at rows and</text>
  <text class="note" x="34" y="1432">cols and never at the maximum:</text>
  <text class="code" xml:space="preserve" x="34" y="1468">for (int r = 0; r &lt; rows; r++)</text>
  <text class="anno" x="316" y="1468">not MAX_ROWS</text>
