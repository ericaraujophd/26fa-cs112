  <text class="anno" x="180" y="234">exactly cols characters</text>
  <path class="flow" d="M91 282 V326" marker-end="url(#wfah)"/>
  <text class="stage" x="109" y="306">loadWorld</text>
  <text class="anno" x="109" y="326">TODO 1</text>
  <text class="stage" x="104" y="360">char grid[MAX_ROWS][MAX_COLS]</text>
  <text class="idx" x="149.0" y="390" text-anchor="middle">0</text>
  <text class="idx" x="187.0" y="390" text-anchor="middle">1</text>
  <text class="idx" x="225.0" y="390" text-anchor="middle">2</text>
