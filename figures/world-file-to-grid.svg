  <path class="flow" d="M782 152.0 H794"/>
  <rect class="tag" x="798" y="136" width="190" height="26" rx="4"/>
  <text class="tagtext" x="808" y="154">emitter, not a cell</text>
  <text class="note" x="798" y="182">It drops one grain of sand</text>
  <text class="note" x="798" y="200">here each step. The grid</text>
  <text class="note" x="798" y="218">itself loads as EMPTY.</text>
  <rect class="cell" x="540" y="311" width="20" height="20"/>
  <text class="code" x="550" y="326" text-anchor="middle">.</text>
  <text class="anno" x="567" y="326">EMPTY</text>
  <rect class="cell" x="626" y="311" width="20" height="20"/>
  <text class="code" x="636" y="326" text-anchor="middle">#</text>
  <text class="anno" x="653" y="326">WALL</text>
  <rect class="cell" x="712" y="311" width="20" height="20"/>
  <text class="code" x="722" y="326" text-anchor="middle">o</text>
  <text class="anno" x="739" y="326">SAND</text>
  <rect class="cell" x="798" y="311" width="20" height="20"/>
  <text class="code" x="808" y="326" text-anchor="middle">~</text>
  <text class="anno" x="825" y="326">WATER</text>
  <text class="stage" x="28" y="388">What loadWorld fills in</text>
  <rect class="card" x="28" y="402" width="430" height="206" rx="6"/>
  <text class="code" xml:space="preserve" x="46" y="434">rows        = 4</text>
  <text class="code" xml:space="preserve" x="46" y="458">cols        = 6</text>
  <text class="code" xml:space="preserve" x="46" y="482">emitCount   = 1</text>
  <text class="code" xml:space="preserve" x="46" y="506">emitRow[0]  = 0    emitCol[0] = 2</text>
  <text class="code" xml:space="preserve" x="46" y="530">emitElem[0] = 'o'  (the word sand)</text>
  <text class="code" xml:space="preserve" x="46" y="554">grid[1][2]  = '#'</text>
  <text class="note" x="46" y="586">Everything after the filename is an out parameter,</text>
  <text class="note" x="46" y="604">which is why they are references and arrays.</text>
  <text class="stage" x="496" y="388">Capacity is not size</text>
  <rect class="card" x="496" y="402" width="476" height="206" rx="6"/>
  <rect class="reserved" x="520" y="428" width="268" height="116"/>
  <rect class="inplay" x="520" y="428" width="46" height="34"/>
  <text class="anno" x="800" y="444">char grid[64][128],</text>
  <text class="anno" x="800" y="462">always reserved</text>
  <text class="anno" x="800" y="498">rows x cols,</text>
  <text class="anno" x="800" y="516">the part in play</text>
  <text class="anno" x="800" y="540">(not to scale)</text>
  <text class="note" x="520" y="586">The array is the same size for every world. Only rows</text>
  <text class="note" x="520" y="604">and cols change, and every loop you write stops at them.</text>
</svg>
