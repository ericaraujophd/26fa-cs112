  <rect class="card" x="18" y="74" width="140" height="197" rx="5"/>
  <text class="val" x="32" y="100">4 6</text>
  <text class="val" x="32" y="125">1</text>
  <text class="val" x="32" y="150">0 2 sand</text>
  <text class="val" x="32" y="175">......</text>
  <text class="val" x="32" y="200">..#...</text>
  <text class="val" x="32" y="225">......</text>
  <text class="val" x="32" y="250">######</text>
  <path class="lead" d="M158 104.5 H165"/>
  <text class="anno" x="170" y="109.5">rows, cols</text>
  <path class="lead" d="M158 129.5 H165"/>
  <text class="anno" x="170" y="134.5">emitter count</text>
  <path class="lead" d="M158 154.5 H165"/>
  <text class="anno" x="170" y="159.5">row, col, element</text>
  <path class="lead" d="M158 217.0 H165"/>
  <text class="anno" x="170" y="222.0">rows lines of</text>
  <path class="lead" d="M163 173 V262"/>
  <text class="anno" x="170" y="241">cols characters</text>
  <path class="flow" d="M296 150 H350" marker-end="url(#wfah)"/>
  <text class="stage" x="323.0" y="136" text-anchor="middle">loadWorld</text>
  <text class="anno" x="323.0" y="172" text-anchor="middle">TODO 1</text>
  <text class="stage" x="378" y="38">char grid[MAX_ROWS][MAX_COLS]</text>
  <text class="idx" x="399.0" y="65" text-anchor="middle">0</text>
  <text class="idx" x="433.0" y="65" text-anchor="middle">1</text>
  <text class="idx" x="467.0" y="65" text-anchor="middle">2</text>
