  <text class="val" x="760.0" y="238.0" text-anchor="middle">.</text>
  <rect class="cellwall" x="540" y="252" width="40" height="40"/>
  <text class="val" x="560.0" y="278.0" text-anchor="middle">#</text>
  <rect class="cellwall" x="580" y="252" width="40" height="40"/>
  <text class="val" x="600.0" y="278.0" text-anchor="middle">#</text>
  <rect class="cellwall" x="620" y="252" width="40" height="40"/>
  <text class="val" x="640.0" y="278.0" text-anchor="middle">#</text>
  <rect class="cellwall" x="660" y="252" width="40" height="40"/>
