<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-labelledby="wf-ttl wf-dsc">
  <title id="wf-ttl">How a world file becomes the grid</title>
  <desc id="wf-dsc">On the left, a world file named worlds slash tiny dot txt containing seven lines: 4 6, then 1, then 0 2 sand, then four rows of six characters each, dot dot dot dot dot dot, dot dot hash dot dot dot, dot dot dot dot dot dot, and six hashes. Labels identify the first line as rows then cols, the second as how many emitter lines follow, the third as one emitter given as row, column and element, and the last four as exactly rows lines of exactly cols characters. An arrow labeled loadWorld points right to a four by six grid of cells with column numbers zero to five along the top and row numbers zero to three down the left side. Each cell holds the character from the matching position in the file. The cell at row one, column two holds a hash and is tinted. The cell at row zero, column two is empty but carries a maroon dashed ring labeled emitter, with a note that the emitter is not a character in the grid and drops one grain of sand each step. A legend gives dot as EMPTY, hash as WALL, o as SAND and tilde as WATER. Below, a card headed what loadWorld fills in lists rows equals 4, cols equals 6, emitCount equals 1, emitRow zero equals 0, emitCol zero equals 2, emitElem zero equals the character o, and grid one two equals the character hash, noting that everything after the filename is an out parameter. A second card headed capacity is not size shows a large faint rectangle labeled char grid 64 by 128, always reserved, with a small solid rectangle in its top left corner labeled rows by cols, the part in play.</desc>

  <style>
    .card      { fill: #FFFFFF; stroke: #DED2D5; stroke-width: 1.2; }
    .slot      { fill: #FBF4F5; stroke: #C9B4B9; stroke-width: 1.2; }
    .cell      { fill: #FFFFFF; stroke: #DED2D5; stroke-width: 1; }
    .cellwall  { fill: #F0E4E7; stroke: #C9B4B9; stroke-width: 1; }
    .reserved  { fill: #FBF4F5; stroke: #DED2D5; stroke-width: 1.2;
                 stroke-dasharray: 5 4; }
    .inplay    { fill: #6E1C2E; opacity: 0.16; stroke: #6E1C2E;
                 stroke-width: 1.2; }
    .val       { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
                 font-size: 17px; fill: #241B1E; }
    .code      { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
                 font-size: 15px; fill: #241B1E; }
    .idx       { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
                 font-size: 14px; fill: #8B7B7F; }
    .stage     { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
                 font-size: 16px; font-weight: 700; fill: #6E1C2E;
                 letter-spacing: .02em; }
    .note      { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
                 font-size: 14px; fill: #6B5A5E; }
    .anno      { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
                 font-size: 13.5px; fill: #8B7B7F; }
    .flow      { stroke: #B9A6AA; stroke-width: 1.4; fill: none; }
    .lead      { stroke: #DED2D5; stroke-width: 1; fill: none; }
    .ring      { fill: none; stroke: #6E1C2E; stroke-width: 2;
                 stroke-dasharray: 4 3; }
    .tag       { fill: #6E1C2E; }
    .tagtext   { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
                 font-size: 14px; fill: #FFFFFF; }

    @media (prefers-color-scheme: dark) {
      .card     { fill: #1E1719; stroke: #3B2D31; }
      .slot     { fill: #2A1D21; stroke: #4A343A; }
      .cell     { fill: #1E1719; stroke: #3B2D31; }
      .cellwall { fill: #3A2A2E; stroke: #4A343A; }
      .reserved { fill: #241C1E; stroke: #3B2D31; }
      .inplay   { fill: #E38DA0; opacity: 0.22; stroke: #E38DA0; }
      .val, .code { fill: #F1E8EA; }
      .idx, .anno { fill: #9E8B90; }
      .stage    { fill: #E38DA0; }
      .note     { fill: #B4A1A6; }
      .flow     { stroke: #5A4649; }
      .lead     { stroke: #3B2D31; }
      .ring     { stroke: #E38DA0; }
      .tag      { fill: #8E2A40; }
    }
  </style>

  <defs>
    <marker id="wfah" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="tag"/>
    </marker>
  </defs>

  <text class="stage" x="28" y="50">worlds/tiny.txt</text>
  <rect class="card" x="28" y="66" width="200" height="219" rx="6"/>
  <text class="val" x="46" y="92">4 6</text>
  <text class="val" x="46" y="119">1</text>
  <text class="val" x="46" y="146">0 2 sand</text>
  <text class="val" x="46" y="173">......</text>
  <text class="val" x="46" y="200">..#...</text>
  <text class="val" x="46" y="227">......</text>
  <text class="val" x="46" y="254">######</text>
  <path class="lead" d="M228 97.5 H236"/>
  <text class="anno" x="242" y="101.5">rows, cols</text>
  <path class="lead" d="M228 124.5 H236"/>
  <text class="anno" x="242" y="128.5">emitter count</text>
  <path class="lead" d="M228 151.5 H236"/>
  <text class="anno" x="242" y="155.5">row, col, element</text>
  <path class="lead" d="M228 219.0 H236"/>
  <text class="anno" x="242" y="223.0">rows lines of</text>
  <path class="lead" d="M234 172 V270"/>
  <text class="anno" x="242" y="243.0">cols characters</text>
  <path class="flow" d="M440 224 H510" marker-end="url(#wfah)"/>
  <text class="stage" x="475.0" y="210" text-anchor="middle">loadWorld</text>
  <text class="anno" x="475.0" y="250" text-anchor="middle">TODO 1</text>
  <text class="stage" x="540" y="88">char grid[MAX_ROWS][MAX_COLS]</text>
  <text class="idx" x="560.0" y="122" text-anchor="middle">0</text>
  <text class="idx" x="600.0" y="122" text-anchor="middle">1</text>
  <text class="idx" x="640.0" y="122" text-anchor="middle">2</text>
