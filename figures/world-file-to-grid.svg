  <text class="idx" x="373" y="164.0" text-anchor="end">2</text>
  <text class="idx" x="373" y="198.0" text-anchor="end">3</text>
  <rect class="cell" x="382" y="74" width="34" height="34"/>
  <text class="val" x="399.0" y="97.0" text-anchor="middle">.</text>
  <rect class="cell" x="416" y="74" width="34" height="34"/>
  <text class="val" x="433.0" y="97.0" text-anchor="middle">.</text>
  <rect class="cell" x="450" y="74" width="34" height="34"/>
