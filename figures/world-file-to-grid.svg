  <text class="anno" x="620" y="236">WATER</text>
  <rect class="tag" x="362" y="266" width="248" height="24" rx="4"/>
  <text class="tagtext" x="372" y="283">the ring at grid[0][2]</text>
  <text class="note" x="362" y="312">is an emitter, not a cell. It drops one</text>
  <text class="note" x="362" y="332">grain of sand there each step; the grid</text>
  <text class="note" x="362" y="352">itself loads with that cell EMPTY.</text>
  <text class="stage" x="18" y="374">What loadWorld fills in</text>
  <rect class="card" x="18" y="386" width="306" height="242" rx="5"/>
  <text class="code" xml:space="preserve" x="34" y="414">rows        = 4</text>
  <text class="code" xml:space="preserve" x="34" y="437">cols        = 6</text>
  <text class="code" xml:space="preserve" x="34" y="460">emitCount   = 1</text>
  <text class="code" xml:space="preserve" x="34" y="483">emitRow[0]  = 0</text>
  <text class="code" xml:space="preserve" x="34" y="506">emitCol[0]  = 2</text>
  <text class="code" xml:space="preserve" x="34" y="529">emitElem[0] = SAND</text>
  <text class="code" xml:space="preserve" x="34" y="552">grid[1][2]  = WALL</text>
  <text class="note" x="34" y="586">Everything after the filename is</text>
  <text class="note" x="34" y="605">an out parameter, filled in for</text>
  <text class="note" x="34" y="624">the caller.</text>
  <text class="stage" x="346" y="374">Capacity is not size</text>
  <rect class="card" x="346" y="386" width="306" height="242" rx="5"/>
  <rect class="reserved" x="364" y="406" width="270" height="92"/>
  <rect class="inplay" x="364" y="406" width="42" height="26"/>
  <text class="anno" x="364" y="520">the whole box: char grid[64][128],</text>
  <text class="anno" x="364" y="539">always reserved. Not to scale.</text>
  <text class="anno" x="364" y="558">the tinted corner: rows x cols, in play</text>
  <text class="note" x="364" y="582">Every loop you write stops at rows</text>
  <text class="note" x="364" y="601">and cols, not at the maximum.</text>
</svg>
