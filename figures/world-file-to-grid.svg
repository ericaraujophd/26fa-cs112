  <rect class="cell" x="580" y="172" width="40" height="40"/>
  <text class="val" x="600.0" y="198.0" text-anchor="middle">.</text>
  <rect class="cellwall" x="620" y="172" width="40" height="40"/>
  <text class="val" x="640.0" y="198.0" text-anchor="middle">#</text>
  <rect class="cell" x="660" y="172" width="40" height="40"/>
  <text class="val" x="680.0" y="198.0" text-anchor="middle">.</text>
  <rect class="cell" x="700" y="172" width="40" height="40"/>
  <text class="val" x="720.0" y="198.0" text-anchor="middle">.</text>
  <rect class="cell" x="740" y="172" width="40" height="40"/>
  <text class="val" x="760.0" y="198.0" text-anchor="middle">.</text>
  <rect class="cell" x="540" y="212" width="40" height="40"/>
