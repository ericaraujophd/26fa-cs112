  <text class="val" x="40" y="138">1</text>
  <text class="val" x="40" y="172">0 2 sand</text>
  <text class="val" x="40" y="206">......</text>
  <text class="val" x="40" y="240">..#...</text>
  <text class="val" x="40" y="274">......</text>
  <text class="val" x="40" y="308">######</text>
  <path class="lead" d="M200 111.0 H208"/>
  <text class="anno" x="214" y="117.0">rows, cols</text>
  <path class="lead" d="M200 145.0 H208"/>
  <text class="anno" x="214" y="151.0">emitter count</text>
  <path class="lead" d="M200 179.0 H208"/>
  <text class="anno" x="214" y="185.0">row, col, element</text>
  <path class="lead" d="M200 264.0 H208"/>
  <text class="anno" x="214" y="270.0">rows lines of</text>
  <path class="lead" d="M206 204 V326"/>
  <text class="anno" x="214" y="294">cols characters</text>
