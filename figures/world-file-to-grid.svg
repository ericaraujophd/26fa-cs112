<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 670 646" width="670" height="646" role="img" aria-labelledby="wf-ttl wf-dsc">
  <title id="wf-ttl">How a world file becomes the grid</title>
  <desc id="wf-dsc">On the left, a world file named worlds slash tiny dot txt containing seven lines: 4 6, then 1, then 0 2 sand, then four rows of six characters each, dot dot dot dot dot dot, dot dot hash dot dot dot, dot dot dot dot dot dot, and six hashes. Labels identify the first line as rows then cols, the second as the emitter count, the third as one emitter given as row, column and element, and the last four as rows lines of cols characters. An arrow labeled loadWorld points right to a four by six grid of cells, headed char grid MAX_ROWS MAX_COLS, with column numbers zero to five along the top and row numbers zero to three down the left side. Each cell holds the character from the matching position in the file. The cell at row one, column two holds a hash and is tinted. The cell at row zero, column two is still a dot but carries a maroon dashed ring. A legend gives dot as EMPTY, hash as WALL, o as SAND and tilde as WATER. Under the grid, a note explains that the ring is an emitter, not a cell: it drops one grain of sand there each step, and the grid itself loads as EMPTY. Below, a card headed what loadWorld fills in lists rows equals 4, cols equals 6, emitCount equals 1, emitRow zero equals 0, emitCol zero equals 2, emitElem zero equals SAND, and grid one two equals WALL, noting that everything after the filename is an out parameter. A second card headed capacity is not size shows a large dashed rectangle with a small tinted rectangle in its top left corner, labeled char grid 64 by 128 always reserved, and the tinted corner as rows by cols, the part in play, not to scale.</desc>

  <style>
    .card      { fill: #FFFFFF; stroke: #DED2D5; stroke-width: 1.2; }
    .cell      { fill: #FFFFFF; stroke: #DED2D5; stroke-width: 1; }
    .cellwall  { fill: #F0E4E7; stroke: #C9B4B9; stroke-width: 1; }
    .reserved  { fill: #FBF4F5; stroke: #DED2D5; stroke-width: 1.2;
                 stroke-dasharray: 5 4; }
    .inplay    { fill: #6E1C2E; opacity: 0.16; stroke: #6E1C2E;
                 stroke-width: 1.2; }
    .val       { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
                 font-size: 17px; fill: #241B1E; }
    .code      { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
                 font-size: 15px; fill: #241B1E; }
    .idx       { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
                 font-size: 13px; fill: #8B7B7F; }
    .stage     { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
                 font-size: 16px; font-weight: 700; fill: #6E1C2E;
                 letter-spacing: .01em; }
    .note      { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
                 font-size: 14px; fill: #6B5A5E; }
    .anno      { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
                 font-size: 13px; fill: #8B7B7F; }
    .flow      { stroke: #B9A6AA; stroke-width: 1.4; fill: none; }
    .lead      { stroke: #DED2D5; stroke-width: 1; fill: none; }
    .ring      { fill: none; stroke: #6E1C2E; stroke-width: 2;
                 stroke-dasharray: 4 3; }
    .tag       { fill: #6E1C2E; }
    .tagtext   { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
                 font-size: 13px; fill: #FFFFFF; }

    @media (prefers-color-scheme: dark) {
      .card     { fill: #1E1719; stroke: #3B2D31; }
      .cell     { fill: #1E1719; stroke: #3B2D31; }
      .cellwall { fill: #3A2A2E; stroke: #4A343A; }
      .reserved { fill: #241C1E; stroke: #3B2D31; }
      .inplay   { fill: #E38DA0; opacity: 0.22; stroke: #E38DA0; }
      .val, .code { fill: #F1E8EA; }
      .idx, .anno { fill: #9E8B90; }
      .stage    { fill: #E38DA0; }
      .note     { fill: #B4A1A6; }
      .flow     { stroke: #5A4649; }
      .lead     { stroke: #3B2D31; }
      .ring     { stroke: #E38DA0; }
      .tag      { fill: #8E2A40; }
    }
  </style>

  <defs>
    <marker id="wfah" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="tag"/>
    </marker>
  </defs>

