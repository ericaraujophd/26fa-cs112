  <text class="idx" x="720.0" y="122" text-anchor="middle">4</text>
  <text class="idx" x="760.0" y="122" text-anchor="middle">5</text>
  <text class="idx" x="528" y="157.0" text-anchor="end">0</text>
  <text class="idx" x="528" y="197.0" text-anchor="end">1</text>
  <text class="idx" x="528" y="237.0" text-anchor="end">2</text>
  <text class="idx" x="528" y="277.0" text-anchor="end">3</text>
  <rect class="cell" x="540" y="132" width="40" height="40"/>
  <text class="val" x="560.0" y="158.0" text-anchor="middle">.</text>
  <rect class="cell" x="580" y="132" width="40" height="40"/>
  <text class="val" x="600.0" y="158.0" text-anchor="middle">.</text>
