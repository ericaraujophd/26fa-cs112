  <rect class="cell" x="580" y="212" width="40" height="40"/>
  <text class="val" x="600.0" y="238.0" text-anchor="middle">.</text>
  <rect class="cell" x="620" y="212" width="40" height="40"/>
  <text class="val" x="640.0" y="238.0" text-anchor="middle">.</text>
