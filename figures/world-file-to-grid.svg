  <text class="anno" x="868" y="350">WATER</text>
  <text class="stage" x="24" y="386">What loadWorld fills in</text>
  <rect class="card" x="24" y="400" width="432" height="276" rx="6"/>
  <text class="code" xml:space="preserve" x="44" y="434">rows        = 4</text>
  <text class="code" xml:space="preserve" x="44" y="461">cols        = 6</text>
  <text class="code" xml:space="preserve" x="44" y="488">emitCount   = 1</text>
  <text class="code" xml:space="preserve" x="44" y="515">emitRow[0]  = 0</text>
  <text class="code" xml:space="preserve" x="44" y="542">emitCol[0]  = 2</text>
  <text class="code" xml:space="preserve" x="44" y="569">emitElem[0] = SAND</text>
  <text class="code" xml:space="preserve" x="44" y="596">grid[1][2]  = WALL</text>
  <text class="note" x="44" y="644">Everything after the filename is an</text>
  <text class="note" x="44" y="668">out parameter, filled in for the caller.</text>
  <text class="stage" x="492" y="386">Capacity is not size</text>
  <rect class="card" x="492" y="400" width="480" height="276" rx="6"/>
  <rect class="reserved" x="514" y="428" width="236" height="130"/>
  <rect class="inplay" x="514" y="428" width="44" height="34"/>
  <text class="anno" x="764" y="448">char grid[64][128],</text>
  <text class="anno" x="764" y="472">always reserved</text>
