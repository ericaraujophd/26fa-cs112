  <rect class="ring" x="227" y="403" width="32" height="32" rx="3"/>
  <rect class="ring" x="341" y="479" width="32" height="32" rx="3"/>
  <rect class="cell" x="16" y="569" width="21" height="21"/>
  <text class="code" x="26.5" y="584" text-anchor="middle">.</text>
  <text class="anno" x="43" y="584">EMPTY</text>
  <rect class="cell" x="140" y="569" width="21" height="21"/>
  <text class="code" x="150.5" y="584" text-anchor="middle">#</text>
  <text class="anno" x="167" y="584">WALL</text>
  <rect class="cell" x="264" y="569" width="21" height="21"/>
  <text class="code" x="274.5" y="584" text-anchor="middle">o</text>
  <text class="anno" x="291" y="584">SAND</text>
  <rect class="cell" x="388" y="569" width="21" height="21"/>
  <text class="code" x="398.5" y="584" text-anchor="middle">~</text>
  <text class="anno" x="415" y="584">WATER</text>
  <rect class="tag" x="16" y="608" width="150" height="26" rx="4"/>
  <text class="tagtext" x="26" y="626">the two rings</text>
  <text class="note" x="16" y="658">are the emitters, and they are not cells. Each drops one</text>
  <text class="note" x="16" y="679">grain there per step, sand at grid[0][2] and water at</text>
  <text class="note" x="16" y="700">grid[2][5]. Both cells load EMPTY.</text>
  <text class="stage" x="16" y="748">What loadWorld fills in</text>
  <rect class="card" x="16" y="760" width="488" height="330" rx="5"/>
  <text class="code" xml:space="preserve" x="34" y="790">rows       = 4        cols       = 6</text>
  <text class="code" xml:space="preserve" x="34" y="816">emitCount  = 2        grid[1][2] = WALL</text>
  <text class="anno" x="34" y="852">three arrays, one column per emitter:</text>
  <text class="idx" x="250.0" y="882" text-anchor="middle">[0]</text>
  <text class="idx" x="342.0" y="882" text-anchor="middle">[1]</text>
  <text class="code" x="46" y="910">emitRow</text>
  <text class="code" x="250.0" y="910" text-anchor="middle">0</text>
  <text class="code" x="342.0" y="910" text-anchor="middle">2</text>
  <text class="code" x="46" y="938">emitCol</text>
  <text class="code" x="250.0" y="938" text-anchor="middle">2</text>
  <text class="code" x="342.0" y="938" text-anchor="middle">5</text>
  <text class="code" x="46" y="966">emitElem</text>
  <text class="code" x="250.0" y="966" text-anchor="middle">SAND</text>
  <text class="code" x="342.0" y="966" text-anchor="middle">WATER</text>
  <rect class="ring" x="210" y="892" width="80" height="88" rx="4"/>
  <rect class="ring" x="302" y="892" width="80" height="88" rx="4"/>
  <text class="note" x="34" y="1012">An emitter is a column, not an array. Its row, its column</text>
  <text class="note" x="34" y="1032">and its element are held together by nothing except the</text>
  <text class="note" x="34" y="1052">index they share. emitCount says how many columns are in</text>
  <text class="note" x="34" y="1072">use; the rest of each array is untouched.</text>
  <text class="stage" x="16" y="1108">Capacity is not size</text>
  <rect class="card" x="16" y="1120" width="488" height="212" rx="5"/>
  <rect class="reserved" x="34" y="1140" width="200" height="78"/>
  <rect class="inplay" x="34" y="1140" width="38" height="24"/>
  <text class="anno" x="250" y="1156">the whole box:</text>
  <text class="anno" x="250" y="1175">char grid[64][128],</text>
  <text class="anno" x="250" y="1194">always reserved</text>
  <text class="anno" x="34" y="1240">the tinted corner: rows x cols,</text>
  <text class="anno" x="34" y="1259">the part in play (not to scale)</text>
  <text class="note" x="34" y="1288">Every loop you write stops at rows and cols,</text>
  <text class="note" x="34" y="1309">not at the maximum.</text>
</svg>
