  <text class="code" x="26.5" y="552" text-anchor="middle">.</text>
  <text class="anno" x="43" y="552">EMPTY</text>
  <rect class="cell" x="140" y="537" width="21" height="21"/>
  <text class="code" x="150.5" y="552" text-anchor="middle">#</text>
  <text class="anno" x="167" y="552">WALL</text>
  <rect class="cell" x="264" y="537" width="21" height="21"/>
  <text class="code" x="274.5" y="552" text-anchor="middle">o</text>
  <text class="anno" x="291" y="552">SAND</text>
  <rect class="cell" x="388" y="537" width="21" height="21"/>
  <text class="code" x="398.5" y="552" text-anchor="middle">~</text>
  <text class="anno" x="415" y="552">WATER</text>
  <rect class="tag" x="16" y="576" width="202" height="26" rx="4"/>
  <text class="tagtext" x="26" y="594">the ring at grid[0][2]</text>
  <text class="note" x="16" y="626">is an emitter, not a cell. It drops one grain of</text>
  <text class="note" x="16" y="647">sand there each step; the grid itself loads with</text>
  <text class="note" x="16" y="668">that cell EMPTY.</text>
  <text class="stage" x="16" y="704">What loadWorld fills in</text>
  <rect class="card" x="16" y="716" width="488" height="226" rx="5"/>
  <text class="code" xml:space="preserve" x="34" y="748">rows        = 4        emitRow[0]  = 0</text>
  <text class="code" xml:space="preserve" x="34" y="774">cols        = 6        emitCol[0]  = 2</text>
  <text class="code" xml:space="preserve" x="34" y="800">emitCount   = 1        emitElem[0] = SAND</text>
  <text class="code" xml:space="preserve" x="34" y="826">grid[1][2]  = WALL</text>
  <text class="note" x="34" y="872">Everything after the filename is an out parameter,</text>
  <text class="note" x="34" y="893">which is why they are references and arrays: the</text>
  <text class="note" x="34" y="914">function fills them in for the caller.</text>
  <text class="stage" x="16" y="970">Capacity is not size</text>
  <rect class="card" x="16" y="982" width="488" height="212" rx="5"/>
  <rect class="reserved" x="34" y="1002" width="200" height="78"/>
  <rect class="inplay" x="34" y="1002" width="38" height="24"/>
  <text class="anno" x="250" y="1018">the whole box:</text>
  <text class="anno" x="250" y="1037">char grid[64][128],</text>
  <text class="anno" x="250" y="1056">always reserved</text>
  <text class="anno" x="34" y="1102">the tinted corner: rows x cols,</text>
