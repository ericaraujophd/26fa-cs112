<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1206" width="520" height="1206" role="img" aria-labelledby="wf-ttl wf-dsc">
  <title id="wf-ttl">How a world file becomes the grid</title>
  <desc id="wf-dsc">At the top, a world file named worlds slash tiny dot txt containing seven lines: 4 6, then 1, then 0 2 sand, then four rows of six characters each, dot dot dot dot dot dot, dot dot hash dot dot dot, dot dot dot dot dot dot, and six hashes. Labels identify the first line as rows then cols, the second as the emitter count, the third as one emitter given as row, column and element, and the last four as rows lines of cols characters. An arrow pointing down, labeled loadWorld, TODO 1, leads to a four by six grid of cells headed char grid MAX_ROWS MAX_COLS, with column numbers zero to five along the top and row numbers zero to three down the left side. Each cell holds the character from the matching position in the file. The cell at row one, column two holds a hash and is tinted. The cell at row zero, column two is still a dot but carries a maroon dashed ring. A legend gives dot as EMPTY, hash as WALL, o as SAND and tilde as WATER. A note explains that the ring at grid zero two is an emitter, not a cell: it drops one grain of sand there each step, and the grid itself loads with that cell EMPTY. Below, a card headed what loadWorld fills in lists rows equals 4, cols equals 6, emitCount equals 1, emitRow zero equals 0, emitCol zero equals 2, emitElem zero equals SAND, and grid one two equals WALL, noting that everything after the filename is an out parameter. A final card headed capacity is not size shows a large dashed rectangle with a small tinted rectangle in its top left corner, labeled as the whole box being char grid 64 by 128, always reserved, and the tinted corner being rows by cols, the part in play, not to scale, with the reminder that every loop stops at rows and cols rather than at the maximum.</desc>

  <style>
    .card      { fill: #FFFFFF; stroke: #DED2D5; stroke-width: 1.2; }
    .cell      { fill: #FFFFFF; stroke: #DED2D5; stroke-width: 1; }
    .cellwall  { fill: #F0E4E7; stroke: #C9B4B9; stroke-width: 1; }
    .reserved  { fill: #FBF4F5; stroke: #DED2D5; stroke-width: 1.2;
                 stroke-dasharray: 5 4; }
    .inplay    { fill: #6E1C2E; opacity: 0.16; stroke: #6E1C2E;
                 stroke-width: 1.2; }
    .val       { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
                 font-size: 17px; fill: #241B1E; }
    .code      { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
                 font-size: 15px; fill: #241B1E; }
    .idx       { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
                 font-size: 14px; fill: #8B7B7F; }
    .stage     { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
                 font-size: 16px; font-weight: 700; fill: #6E1C2E;
                 letter-spacing: .01em; }
    .note      { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
                 font-size: 15px; fill: #6B5A5E; }
    .anno      { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
                 font-size: 14px; fill: #8B7B7F; }
    .flow      { stroke: #B9A6AA; stroke-width: 1.6; fill: none; }
    .lead      { stroke: #DED2D5; stroke-width: 1; fill: none; }
    .ring      { fill: none; stroke: #6E1C2E; stroke-width: 2;
                 stroke-dasharray: 4 3; }
    .tag       { fill: #6E1C2E; }
    .tagtext   { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
                 font-size: 14px; fill: #FFFFFF; }

    @media (prefers-color-scheme: dark) {
      .card     { fill: #1E1719; stroke: #3B2D31; }
      .cell     { fill: #1E1719; stroke: #3B2D31; }
      .cellwall { fill: #3A2A2E; stroke: #4A343A; }
      .reserved { fill: #241C1E; stroke: #3B2D31; }
      .inplay   { fill: #E38DA0; opacity: 0.22; stroke: #E38DA0; }
      .val, .code { fill: #F1E8EA; }
      .idx, .anno { fill: #9E8B90; }
      .stage    { fill: #E38DA0; }
      .note     { fill: #B4A1A6; }
      .flow     { stroke: #5A4649; }
      .lead     { stroke: #3B2D31; }
      .ring     { stroke: #E38DA0; }
      .tag      { fill: #8E2A40; }
    }
  </style>

  <defs>
    <marker id="wfah" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="tag"/>
    </marker>
  </defs>

  <text class="stage" x="16" y="28">worlds/tiny.txt</text>
  <rect class="card" x="16" y="42" width="150" height="197" rx="5"/>
  <text class="val" x="32" y="68">4 6</text>
  <text class="val" x="32" y="93">1</text>
  <text class="val" x="32" y="118">0 2 sand</text>
  <text class="val" x="32" y="143">......</text>
  <text class="val" x="32" y="168">..#...</text>
  <text class="val" x="32" y="193">......</text>
  <text class="val" x="32" y="218">######</text>
  <path class="lead" d="M166 72.5 H174"/>
  <text class="anno" x="180" y="77.5">rows, cols</text>
  <path class="lead" d="M166 97.5 H174"/>
  <text class="anno" x="180" y="102.5">how many emitters follow</text>
  <path class="lead" d="M166 122.5 H174"/>
  <text class="anno" x="180" y="127.5">one emitter: row, col, element</text>
  <path class="lead" d="M166 185.0 H174"/>
  <text class="anno" x="180" y="190.0">exactly rows lines of</text>
  <path class="lead" d="M172 141 V230"/>
  <text class="anno" x="180" y="209">exactly cols characters</text>
  <path class="flow" d="M91 250 V294" marker-end="url(#wfah)"/>
  <text class="stage" x="109" y="274">loadWorld</text>
  <text class="anno" x="109" y="294">TODO 1</text>
  <text class="stage" x="122" y="328">char grid[MAX_ROWS][MAX_COLS]</text>
  <text class="idx" x="167.0" y="358" text-anchor="middle">0</text>
  <text class="idx" x="205.0" y="358" text-anchor="middle">1</text>
  <text class="idx" x="243.0" y="358" text-anchor="middle">2</text>
  <text class="idx" x="281.0" y="358" text-anchor="middle">3</text>
  <text class="idx" x="319.0" y="358" text-anchor="middle">4</text>
  <text class="idx" x="357.0" y="358" text-anchor="middle">5</text>
  <text class="idx" x="138" y="392.0" text-anchor="end">0</text>
