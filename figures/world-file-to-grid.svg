<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1500" width="520" height="1500" role="img" aria-labelledby="wf-ttl wf-dsc">
  <title id="wf-ttl">How a world file becomes the grid</title>
  <desc id="wf-dsc">At the top, a world file named worlds slash tiny dot txt containing eight lines: 4 6, then 2, then 0 2 sand, then 2 5 water, then four rows of six characters each, dot dot dot dot dot dot, dot dot hash dot dot dot, dot dot dot dot dot dot, and six hashes. Labels identify the first line as rows and cols, the second as how many emitters follow, the next two as each giving a row, a column and an element, and the last four as exactly rows lines of exactly cols characters. An arrow pointing down, labeled loadWorld, TODO 1, leads to a four by six grid of cells headed char grid MAX_ROWS MAX_COLS, with column numbers zero to five along the top and row numbers zero to three down the left side. Each cell holds the character from the matching position in the file. The cell at row one, column two holds a hash and is tinted. The cells at row zero column two and row two column five are still dots, and each carries a maroon dashed ring. Beside the grid a legend gives dot as EMPTY, hash as WALL, o as SAND and tilde as WATER. Below it, a note says the two rings are the emitters and are not cells: each drops one grain per step, sand at grid zero two and water at grid two five, and both cells load EMPTY. Next, a card headed what loadWorld fills in gives rows equals 4, cols equals 6, emitCount equals 2 and grid one two equals WALL, then a table captioned three arrays, one column per emitter. The table rows are labeled emitRow, emitCol and emitElem; the columns are headed bracket zero and bracket one and each is outlined, the first holding 0, 2 and SAND, the second 2, 5 and WATER. A note says an emitter is a column, not an array, that its row, column and element are held together by nothing except the index they share, and that emitCount says how many columns are in use while the rest of each array is untouched. The last card, headed capacity is not size, draws the reserved array to scale: a large dashed rectangle standing for char grid 64 by 128, that is 8192 cells, with this world marked in its top left corner as a tiny ringed rectangle labeled 4 by 6 equals 24 cells. Underneath it says the other 8168 hold whatever was in that memory before, that nobody cleared them, that reading one is reading rubbish, and that this is why every loop stops at rows and cols and never at the maximum, ending with the line for open paren int r equals 0 semicolon r less than rows semicolon r plus plus close paren, annotated not MAX_ROWS.</desc>

  <style>
    .card      { fill: #FFFFFF; stroke: #DED2D5; stroke-width: 1.2; }
    .cell      { fill: #FFFFFF; stroke: #DED2D5; stroke-width: 1; }
    .cellwall  { fill: #F0E4E7; stroke: #C9B4B9; stroke-width: 1; }
    .reserved  { fill: #FBF4F5; stroke: #DED2D5; stroke-width: 1.2;
                 stroke-dasharray: 5 4; }
    .inplay    { fill: #6E1C2E; opacity: 0.16; stroke: #6E1C2E;
                 stroke-width: 1.2; }
    .val       { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
                 font-size: 17px; fill: #241B1E; }
    .code      { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
                 font-size: 15px; fill: #241B1E; }
    .idx       { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
                 font-size: 14px; fill: #8B7B7F; }
    .stage     { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
                 font-size: 16px; font-weight: 700; fill: #6E1C2E;
                 letter-spacing: .01em; }
    .note      { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
                 font-size: 15px; fill: #6B5A5E; }
    .anno      { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
                 font-size: 14px; fill: #8B7B7F; }
    .flow      { stroke: #B9A6AA; stroke-width: 1.6; fill: none; }
    .lead      { stroke: #DED2D5; stroke-width: 1; fill: none; }
    .ring      { fill: none; stroke: #6E1C2E; stroke-width: 2;
                 stroke-dasharray: 4 3; }
    .tag       { fill: #6E1C2E; }
    .tagtext   { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
                 font-size: 14px; fill: #FFFFFF; }

    @media (prefers-color-scheme: dark) {
      .card     { fill: #1E1719; stroke: #3B2D31; }
      .cell     { fill: #1E1719; stroke: #3B2D31; }
      .cellwall { fill: #3A2A2E; stroke: #4A343A; }
      .reserved { fill: #241C1E; stroke: #3B2D31; }
      .inplay   { fill: #E38DA0; opacity: 0.22; stroke: #E38DA0; }
      .val, .code { fill: #F1E8EA; }
      .idx, .anno { fill: #9E8B90; }
      .stage    { fill: #E38DA0; }
      .note     { fill: #B4A1A6; }
      .flow     { stroke: #5A4649; }
      .lead     { stroke: #3B2D31; }
      .ring     { stroke: #E38DA0; }
      .tag      { fill: #8E2A40; }
    }
  </style>

  <defs>
    <marker id="wfah" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" class="tag"/>
    </marker>
  </defs>

