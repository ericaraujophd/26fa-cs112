<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Turning Copilot's inline suggestions off in VS Code</title>
  <desc id="dsc">Two parts. On the left, the bottom-right corner of the VS Code status bar, with the small Copilot icon circled. On the right, the Copilot panel that opens when you click it: a Copilot Pro header, a credits row, then a row reading Inline Suggestions with the word Disabled on the right, and beneath it an unticked checkbox labelled Ghost text suggestions, a greyed-out Next edit suggestions checkbox, and an Eagerness setting. The Copilot icon, the Inline Suggestions row, the Ghost text checkbox and the word Disabled are each numbered one to four.</desc>

  <style>
    .ui   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: #cfd2d6; }
    .dim  { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: #7d828a; }
    .hd   { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13.5px; fill: #e8eaed; font-weight: 600; }
    .lbl  { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #6E1C2E; }
    .sub  { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #6b7280; }
    .lead { stroke: #6E1C2E; stroke-width: 1.3; fill: none; stroke-dasharray: 3 3; }
    .ring { fill: none; stroke: #D6546A; stroke-width: 2.5; }
  </style>

  <!-- ─── left: the status bar corner ─────────────────────────────── -->
  <text x="24" y="40" class="lbl">Bottom-right corner of the VS Code window</text>
  <rect x="24" y="56" width="300" height="40" rx="4" fill="#181818" stroke="#2c2f34"/>
  <text x="40" y="81" class="dim">0.005/4 cores (0%)</text>

  <!-- copilot glyph -->
  <g transform="translate(258,66)">
    <rect x="0" y="4" width="20" height="13" rx="6.5" fill="#9aa0aa"/>
    <circle cx="6" cy="10.5" r="2.4" fill="#181818"/>
    <circle cx="14" cy="10.5" r="2.4" fill="#181818"/>
    <path d="M4 4 C 6 0, 14 0, 16 4" stroke="#9aa0aa" stroke-width="2" fill="none"/>
  </g>
  <!-- bell -->
  <path d="M296 71 a5 5 0 0 1 10 0 c0 5 2 6 2 7 h-14 c0 -1 2 -2 2 -7 z" fill="#9aa0aa"/>

  <circle cx="268" cy="76" r="18" class="ring"/>
  <circle cx="212" cy="122" r="12" fill="#6E1C2E"/>
  <text x="208" y="127" class="ui" style="font-weight:700; fill:#fff;">1</text>
  <path class="lead" d="M 224 122 H 262 V 96"/>
  <text x="24" y="150" class="lbl">1. Click the Copilot icon.</text>
  <text x="24" y="168" class="sub">It sits between the CPU reading and the bell.</text>

  <!-- ─── right: the panel ────────────────────────────────────────── -->
  <rect x="430" y="56" width="340" height="330" rx="6" fill="#1f2024" stroke="#3a3d43"/>

  <text x="450" y="86" class="hd">Copilot Pro</text>
  <rect x="676" y="70" width="72" height="24" rx="4" fill="#2f7bd6"/>
  <text x="694" y="87" class="ui" style="fill:#fff;">Upgrade</text>

  <text x="450" y="120" class="hd">Credits</text>
  <text x="750" y="120" class="dim" text-anchor="end">Resets Aug 31</text>
  <text x="450" y="142" class="hd" style="font-size:16px;">0%</text>
  <text x="482" y="142" class="dim">used</text>
  <line x1="450" y1="160" x2="750" y2="160" stroke="#3a3d43"/>

  <!-- inline suggestions row -->
  <text x="450" y="192" class="ui">Inline Suggestions</text>
  <path d="M566 187 l5 5 l5 -5" stroke="#cfd2d6" stroke-width="1.6" fill="none"/>
  <text x="750" y="192" class="ui" text-anchor="end">Disabled</text>

  <!-- ghost text checkbox -->
  <rect x="452" y="212" width="14" height="14" rx="2.5" fill="none" stroke="#8a8f98" stroke-width="1.6"/>
  <text x="476" y="224" class="ui">Ghost text suggestions</text>

  <rect x="452" y="240" width="14" height="14" rx="2.5" fill="none" stroke="#4a4e55" stroke-width="1.6"/>
  <text x="476" y="252" class="dim" style="fill:#5b6068;">Next edit suggestions</text>

  <text x="450" y="284" class="ui">Eagerness</text>
  <rect x="668" y="270" width="80" height="22" rx="4" fill="#2a2d32" stroke="#3a3d43"/>
  <text x="682" y="285" class="dim">Auto</text>

  <line x1="450" y1="312" x2="750" y2="312" stroke="#3a3d43"/>
  <text x="450" y="338" class="dim">Codebase Semantic Index</text>
  <text x="450" y="366" class="dim">Session Sync</text>

  <!-- callouts -->
  <rect x="444" y="176" width="316" height="24" rx="4" class="ring" opacity="0.9"/>
  <circle cx="410" cy="188" r="12" fill="#6E1C2E"/>
  <text x="406" y="193" class="ui" style="font-weight:700; fill:#fff;">2</text>
  <path class="lead" d="M 422 188 H 442"/>

  <rect x="446" y="208" width="200" height="22" rx="4" class="ring" opacity="0.9"/>
  <circle cx="410" cy="219" r="12" fill="#6E1C2E"/>
  <text x="406" y="224" class="ui" style="font-weight:700; fill:#fff;">3</text>
  <path class="lead" d="M 422 219 H 444"/>

  <circle cx="800" cy="192" r="12" fill="#6E1C2E"/>
  <text x="796" y="197" class="ui" style="font-weight:700; fill:#fff;">4</text>
  <path class="lead" d="M 788 192 H 762"/>

  <text x="24" y="230" class="lbl">2. Click Inline Suggestions</text>
  <text x="24" y="248" class="sub">to expand the section.</text>

  <text x="24" y="286" class="lbl">3. Untick Ghost text suggestions</text>
  <text x="24" y="304" class="sub">this is the grey text Copilot writes</text>
  <text x="24" y="320" class="sub">ahead of your cursor.</text>

  <text x="24" y="358" class="lbl">4. Check it now reads Disabled</text>
  <text x="24" y="376" class="sub">that is how you know it worked.</text>

  <text x="24" y="424" class="sub">Turning this off stops the autocomplete. It does not close Copilot Chat,</text>
  <text x="24" y="442" class="sub">which is also not allowed in CS112.</text>
</svg>
