<!-- Display settings panel: theme + text size.
     Injected into the sidebar when one exists, otherwise pinned bottom-right.
     The theme buttons drive Quarto's own colour-scheme toggle (which is hidden
     via CSS) so stylesheet swapping and persistence stay Quarto's job. -->
<template id="disp-panel-template">
  <div class="disp-panel">

    <div class="disp-row disp-row-theme">
      <span class="disp-label">Theme</span>
      <div class="disp-btns">
        <button type="button" class="disp-btn theme-btn" data-mode="light" title="Light theme">
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <circle cx="8" cy="8" r="3.25" fill="currentColor"/>
            <g stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
              <path d="M8 1v1.6M8 13.4V15M15 8h-1.6M2.6 8H1M12.9 3.1l-1.1 1.1M4.2 11.8l-1.1 1.1M12.9 12.9l-1.1-1.1M4.2 4.2L3.1 3.1"/>
            </g>
          </svg>
          <span>Light</span>
        </button>
        <button type="button" class="disp-btn theme-btn" data-mode="dark" title="Dark theme">
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M13.5 10.3A5.9 5.9 0 0 1 5.7 2.5a6 6 0 1 0 7.8 7.8z"/>
          </svg>
          <span>Dark</span>
        </button>
      </div>
    </div>

    <div class="disp-row">
      <span class="disp-label">Text size</span>
      <div class="disp-btns" role="group" aria-label="Text size">
        <button type="button" class="disp-btn fs-btn fs-btn-s" data-size="small"  title="Small text (default)">A</button>
        <button type="button" class="disp-btn fs-btn fs-btn-m" data-size="medium" title="Medium text">A</button>
        <button type="button" class="disp-btn fs-btn fs-btn-l" data-size="large"  title="Large text">A</button>
      </div>
    </div>

  </div>
</template>

<script>
(function () {
  var KEY   = 'cs112-fontsize';
  var SIZES = ['small', 'medium', 'large'];

  /* ── text size ─────────────────────────────────────────── */
  function readSize() {
    try {
      var v = window.localStorage.getItem(KEY);
      return SIZES.indexOf(v) > -1 ? v : 'small';
    } catch (e) { return 'small'; }
  }
  function writeSize(v) {
    try { window.localStorage.setItem(KEY, v); } catch (e) {}
  }
  function applySize(size) {
    document.documentElement.setAttribute('data-fontsize', size);
    document.querySelectorAll('.fs-btn').forEach(function (b) {
      var on = b.getAttribute('data-size') === size;
      b.classList.toggle('active', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }

  /* ── theme ─────────────────────────────────────────────── */
  function quartoToggle() {
    return document.querySelector('.quarto-color-scheme-toggle');
  }
  function isDark() {
    return document.body.classList.contains('quarto-dark');
  }
  function setMode(wantDark) {
    if (isDark() === wantDark) return;
    var t = quartoToggle();
    if (t) t.click();          // let Quarto swap sheets + persist
  }
  function syncTheme() {
    var dark = isDark();
    document.querySelectorAll('.theme-btn').forEach(function (b) {
      var on = (b.getAttribute('data-mode') === 'dark') === dark;
      b.classList.toggle('active', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }

  /* ── build ─────────────────────────────────────────────── */
  function build() {
    var tpl = document.getElementById('disp-panel-template');
    if (!tpl) return;

    var node = tpl.content.firstElementChild.cloneNode(true);

    // No Quarto toggle on the page => no light/dark pair configured.
    if (!quartoToggle()) {
      var row = node.querySelector('.disp-row-theme');
      if (row) row.remove();
    }

    var sidebar = document.querySelector('#quarto-sidebar .sidebar-menu-container')
               || document.querySelector('#quarto-sidebar nav')
               || document.querySelector('#quarto-sidebar');

    if (sidebar) {
      sidebar.appendChild(node);
    } else {
      node.classList.add('disp-panel-float');
      document.body.appendChild(node);
    }

    node.addEventListener('click', function (ev) {
      var fs = ev.target.closest('.fs-btn');
      if (fs) {
        var size = fs.getAttribute('data-size');
        writeSize(size);
        applySize(size);
        return;
      }
      var th = ev.target.closest('.theme-btn');
      if (th) setMode(th.getAttribute('data-mode') === 'dark');
    });

    applySize(readSize());
    syncTheme();

    // Keep buttons in step if the theme changes by any other route.
    new MutationObserver(syncTheme).observe(document.body, {
      attributes: true, attributeFilter: ['class']
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', build);
  } else {
    build();
  }
})();
</script>
